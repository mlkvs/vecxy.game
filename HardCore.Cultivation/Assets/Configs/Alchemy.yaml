# ============================================================
# АЛХИМИЯ
# ============================================================
# В окне алхимии есть два режима:
# 1. Пилюля — смешивает 2–6 ингредиентов и переносит в результат свойства,
#    которые достаточно часто повторяются в смеси.
# 2. Рафинирование — перерабатывает 2–6 одинаковых ингредиентов одной ступени
#    в экстракт. Экстракты можно рафинировать повторно.

enabled: true

# Технические предметы-результаты должны существовать в Items.yaml.
craftedPillItemId: crafted_alchemy_pill
purityPillItemId: purity_pill
extractItemId: alchemy_extract

# Общий размер смеси.
minimumIngredients: 2
maximumIngredients: 6

# Каждый ингредиент даёт своему свойству шанс 1 / числа ингредиентов.
# Для одинакового свойства шансы складываются: 3 одинаковых из 5 дают 60%.
# Бросок выполняется для каждого типа свойства.
# Максимум эффектов в одной пилюле. Сейчас пилюля может получить только один.
maximumPillEffects: 1
pillDurationTicks: 48

# За один крафт пилюли создаётся случайное количество экземпляров. Сумма всех
# chancePercent обязана быть равна 100.
pillOutputQuantityChances:
  - { quantity: 1, chancePercent: 45 }
  - { quantity: 2, chancePercent: 25 }
  - { quantity: 3, chancePercent: 15 }
  - { quantity: 4, chancePercent: 8 }
  - { quantity: 5, chancePercent: 5 }
  - { quantity: 6, chancePercent: 2 }

# Формула качества и редкости каждой отдельной созданной пилюли:
# Xp = clamp(round(averageWeight * weightedAverage + maximumWeight * Xmax
#                  + sigma0 * sqrt(referenceIngredientCount / n) * Z),
#            Xmin - 1, Xmax + 1)
# Ядро входит в weightedAverage с весом coreRankWeight. Формула считается
# независимо для качества и редкости, Z имеет распределение N(0, 1).
resultAverageWeight: 0.6
resultMaximumWeight: 0.4
coreRankWeight: 1.5
qualityRandomnessSigma: 0.30
rarityRandomnessSigma: 0.40
randomnessReferenceIngredientCount: 2

# Пилюля обязательно требует ровно одно ядро. Ядро не участвует в подсчёте
# совпадений свойств, но участвует в расчёте качества и редкости с весом выше.

# Качество всегда ограничено пятью звёздами.
maximumQuality: 5.0

# Рафинирование повышает качество за каждую единицу сырья и за каждую уже
# пройденную ступень. Редкость результата берётся как округлённое среднее.
distillationQualityPerIngredient: 0.12
distillationQualityPerLevel: 0.18

# Вероятность успеха создания: min(95%, 10 * (качество ядра + среднее качество
# ингредиентов)). При рафинировании ядра нет, поэтому учитывается только среднее
# качество сырья. Неудача уничтожает все предметы, положенные в алхимию.
craftSuccessChancePerQuality: 10
maximumCraftSuccessChance: 95

# Итоговая сила эффекта созданной пилюли соответствует таблице баланса:
# baseValue * coverage * qualityPriceCurve(quality) * rarityMultiplier.
# Количество ингредиентов определяет доступность рецепта и coverage свойства,
# но не создаёт отдельный экспоненциальный множитель. Стихийная совместимость
# и загрязнение применяются после этой формулы.

# Рецепт очищения: если все внешние ингредиенты имеют purification, пилюля
# чистоты создаётся гарантированно.
# Если в смеси есть и другие свойства, крафт всё равно разрешён:
# - шанс ниже определяет шанс получения обычной пилюли из остальных
#   совпавших свойств смеси;
# - если шанс не сработал, получится пилюля чистоты.
# Если совпавших обычных свойств нет, смешанный рецепт всё равно создаст
# пилюлю чистоты и не будет блокировать кнопку крафта.
purificationPropertyId: purification
purificationMixedRecipeChance: 0.35
# Диапазон процента, который создаваемая пилюля снимает ДО передачи своего загрязнения.
purificationMinimumPercent: 25
purificationMaximumPercent: 55

# Совместимость учитывает каждую пару внешних ингредиентов, а также пару
# центрального ядра с каждым внешним ингредиентом. Ядро без стихии не даёт
# дополнительного вклада, поэтому старые рецепты остаются совместимыми.
elementCompatibilityCoefficient: 0.15
elementCompatibility:
  Fire: { Fire: 0.5, Water: -1, Earth: 0, Air: 1, Void: 0 }
  Water: { Fire: -1, Water: 0.5, Earth: 1, Air: 0, Void: 0 }
  Earth: { Fire: 0, Water: 1, Earth: 0.5, Air: -1, Void: 0 }
  Air: { Fire: 1, Water: 0, Earth: -1, Air: 0.5, Void: 0 }
  Void: { Fire: 0, Water: 0, Earth: 0, Air: 0, Void: 0.5 }

# Загрязнение - свойство экземпляра предмета: 0 чистый, 1 загрязнённый.
# Эта кривая одновременно влияет на силу создаваемых пилюль и intrinsic price
# предметов до магазинной наценки. Резкий переход 0 -> 0.01 задан балансом
# намеренно, не сглаживайте его.
contaminationModifierCurve:
  - { contamination: 0.0, multiplier: 1.25 }
  - { contamination: 0.01, multiplier: 0.99 }
  - { contamination: 0.50, multiplier: 0.50 }
  - { contamination: 0.75, multiplier: 0.25 }
  - { contamination: 1.00, multiplier: 0.10 }

# Каталог алхимических свойств. baseValue — колонка «Нач. эфф (обыч 1 зв)»
# из балансовой таблицы для поддерживаемого типа эффекта. Итоговая сила при
# 100% совпадении дополнительно умножается на качество и редкость
# созданной пилюли, поэтому не повышайте эти малые стартовые значения вручную.
# Алхимические пилюли временные: для постоянной атаки и максимума здоровья
# используйте готовые Core-предметы из Items.yaml. Мгновенное исцеление также
# задаётся готовыми Instant-пилюлями, чтобы не создавать временный эффект без действия.
properties:
  - id: purification
    displayName: Очищение
    pillName: Пилюля чистоты
    effectType: PurifyContamination
    operation: Flat
    baseValue: 0

  - id: spirit_flow
    displayName: Поток ци
    pillName: Пилюля духовного потока
    effectType: SpiritualPowerGain
    operation: AdditivePercent
    baseValue: 1

  - id: clarity
    displayName: Ясность
    pillName: Пилюля ясного сознания
    effectType: TickEfficiency
    operation: AdditivePercent
    baseValue: 0.1

  - id: longevity
    displayName: Долголетие
    pillName: Пилюля тихих лет
    effectType: AgingSpeed
    operation: AdditivePercent
    baseValue: -1

  - id: vitality
    displayName: Жизненность
    pillName: Пилюля живой крови
    effectType: HealthRegeneration
    operation: AdditivePercent
    baseValue: 1

  - id: jade_body
    displayName: Нефритовое тело
    pillName: Пилюля нефритового тела
    effectType: MaximumHealth
    operation: Flat
    baseValue: 1

  - id: blade_intent
    displayName: Намерение клинка
    pillName: Пилюля острого намерения
    effectType: Attack
    operation: Flat
    baseValue: 0.1

  - id: wind_step
    displayName: Шаг ветра
    pillName: Пилюля шага ветра
    effectType: AttackSpeed
    operation: AdditivePercent
    baseValue: 1

  - id: swiftness
    displayName: Стремительность
    pillName: Пилюля быстрого пути
    effectType: MissionProgress
    operation: AdditivePercent
    baseValue: 1

  - id: insight
    displayName: Прозрение
    pillName: Пилюля прозрения
    effectType: BreakthroughChance
    operation: Flat
    baseValue: 1
