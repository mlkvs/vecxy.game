# ============================================================
# БОЙ, ЗДОРОВЬЕ ГЕРОЯ И ВОССТАНОВЛЕНИЕ
# ============================================================
# Здесь настраиваются размер боевой RenderTexture, защита героя, уровни
# опасности и боевые фоны. Максимум здоровья, восстановление, атака и скорость
# героя рассчитываются из GameBalance.yaml и Cultivation.yaml.
#
# В каждой стадии 10 уровней: от 1 до 10. Базовые характеристики и прибавки
# уровня задаются в GameBalance.yaml и Cultivation.yaml; эффекты предметов и
# загрязнение применяются к ним перед каждым боевым ударом.

# Разрешение картинки боя внутри карточки миссии, в пикселях.
# Желательно сохранять 16:9. Чем оно выше, тем больше расход видеопамяти.
renderWidth: 576
renderHeight: 324

# Базовый путь к спрайтшитам героя без суффикса и расширения.
# Ожидаются файлы _idle.png, _attack.png, _hurt.png и _death.png.
heroSpriteSet: Textures/Characters/3 Man/Man

# Устаревшее поле, оставлено для совместимости старых конфигов.
heroBaseHealth: 100

# Устаревшее поле, оставлено для совместимости старых конфигов.
heroBaseAttack: 1

# Защита вычитается из входящего урона. Атака всегда наносит минимум 1 HP.
heroBaseDefense: 3
heroDefensePerStage: 2
heroDefensePerLevel: 0.5

# Устаревшее поле, оставлено для совместимости старых конфигов.
heroAttacksPerSecond: 1

# Устаревшее поле, оставлено для совместимости старых конфигов.
healthRegenerationPerSecond: 1

# Legacy-параметр для совместимости старых сохранений/конфигов.
# Миссии больше не блокируются после поражения.
recoveryHealthPoints: 30

# Задержка в секундах после исхода боя для показа финальной анимации.
finishDelaySeconds: 1.2

# УРОВНИ ОПАСНОСТИ
# level — уникальный номер для dangerLevel в Missions.yaml.
# encounterChancePercent — шанс боя при принятии миссии, от 0 до 100.
# statReference выбирает теоретические характеристики стадии, statMultiplier
# масштабирует HP, regen, attack и скорость. Defense монстра остаётся контентным.
dangerLevels:
  - level: 1
    name: Weak
    encounterChancePercent: 35
    statReference: StageStart
    statMultiplier: 0.90
  - level: 2
    name: Medium
    encounterChancePercent: 65
    statReference: StageEnd
    statMultiplier: 0.45
  - level: 3
    name: Strong
    encounterChancePercent: 90
    statReference: StageEnd
    statMultiplier: 0.90

# БОЕВЫЕ ФОНЫ
# id используется в possibleBackgroundIds из Missions.yaml.
# Первый слой рисуется глубже всех, каждый следующий — поверх предыдущего.
backgrounds:
  - id: mist_forest
    layers:
      - Textures/Backgrounds/1/1.png
      - Textures/Backgrounds/1/2.png
      - Textures/Backgrounds/1/3.png
      - Textures/Backgrounds/1/4.png
      - Textures/Backgrounds/1/5.png
  - id: mountain_pass
    layers:
      - Textures/Backgrounds/2/1.png
      - Textures/Backgrounds/2/2.png
      - Textures/Backgrounds/2/3.png
      - Textures/Backgrounds/2/4.png
      - Textures/Backgrounds/2/5.png
      - Textures/Backgrounds/2/6.png
  - id: ancient_ruins
    layers:
      - Textures/Backgrounds/3/1.png
      - Textures/Backgrounds/3/2.png
      - Textures/Backgrounds/3/3.png
      - Textures/Backgrounds/3/4.png
      - Textures/Backgrounds/3/5.png
  - id: storm_valley
    layers:
      - Textures/Backgrounds/4/1.png
      - Textures/Backgrounds/4/2.png
      - Textures/Backgrounds/4/3.png
      - Textures/Backgrounds/4/4.png
      - Textures/Backgrounds/4/5.png
      - Textures/Backgrounds/4/6.png
