# ============================================================
# ГЛОБАЛЬНЫЙ БАЛАНС ИГРЫ
# ============================================================
# Этот файл управляет базовой экономикой, скоростью тиков,
# стартовыми условиями и математикой качества предметов.
#
# Важно:
# - 1 tick = 1 игровой шаг симуляции.
# - Тик используется для культивации, старения, миссий, эффектов и автосейва.
# - Если сильно менять несколько параметров сразу, легко "сломать" темп игры.
#
# Рекомендуемый подход:
# 1. Сначала настраивать скорость прогресса через baseSpiritualPowerPerTick.
# 2. Потом отдельно настраивать стоимость уровней и стадий в Cultivation.yaml.
# 3. И только после этого трогать редкости, цены и миссии.

# Сколько тиков составляет 1 игровой год.
# Сейчас 48 = 48 игровых недель.
# Чем меньше число, тем быстрее идёт календарь и старение.
ticksPerYear: 48

# Сколько миллисекунд реального времени длится 1 тик.
# 1000 = 1 тик в секунду.
# Если уменьшить, игра станет быстрее в idle-режиме.
realMillisecondsPerTick: 1000

# Как часто игра делает автосохранение.
# Значение указывается в тиках.
# 12 = раз в четверть игрового года при текущем ticksPerYear.
autoSaveEveryTicks: 12

# Базовое количество духовной силы за 1 тик или 1 тап ДО модификаторов.
# Стадия культивации не влияет ни на тик, ни на тап: оба всегда начинаются
# с этой базы. Увеличивать силу могут только эффекты предметов/пилюль,
# а временные эффекты и загрязнение могут её снижать.
baseSpiritualPowerPerTick: 1.0

# Нижняя граница эффективности тика.
# Нужна как защита от слишком сильных штрафов.
# 0.1 = тик никогда не станет слабее 10% от базы.
minimumTickEfficiency: 0.1

# Нижняя граница множителя старения.
# 0.0 = старение можно полностью остановить, но нельзя сделать "омоложение".
minimumAgingMultiplier: 0.0

# Верхний предел итогового шанса прорыва.
# Даже если предметы и бафы дают больше, шанс будет обрезан этим значением.
maximumBreakthroughChance: 95.0

# Сила обычного предмета использует ту же формулу, что и его цена:
# effect = baseValue * qualityPriceCurve(quality) * rarity.priceMultiplier.
# Для качества 0.1 используются lowQualityPriceMultipliers. Созданные в
# алхимии пилюли исключены: их CraftedEffect уже содержит итоговую силу рецепта.

# Сколько рублей получает игрок на старте.
startingMoney: 1000

# Стартовый возраст персонажа в годах.
startingAgeYears: 12.0

# Стартовые боевые характеристики до прибавок за уровни и прорывы.
# Это исходная строка таблицы баланса: 100 HP, 1 HP/с, 1 атака,
# 1 атака/с и 63 года долголетия. Остальные значения вычисляются из
# Cultivation.yaml и не дублируются здесь.
initialCharacterStats: { maximumHealth: 100, healthRegeneration: 1, attack: 1, attacksPerSecond: 1, longevityYears: 63 }

# Максимальное количество миссий в очереди.
# Если увеличить слишком сильно, игрок будет реже принимать решения.
maximumMissionQueueSize: 6

# Весовые диапазоны качества предметов.
# index = "звёздность" качества, от 1 до 5.
# weight = шанс выпадения диапазона.
#
# Важно:
# - index не должен выходить за диапазон 1..5.
# - чем выше weight, тем чаще выпадает этот tier качества.
qualityBands:
  # 1-звёздочный диапазон. Самый частый.
  - index: 1
    weight: 43
  # 2-звёздочный диапазон.
  - index: 2
    weight: 25
  # 3-звёздочный диапазон.
  - index: 3
    weight: 20
  # 4-звёздочный диапазон.
  - index: 4
    weight: 10
  # 5-звёздочный диапазон. Самый редкий.
  - index: 5
    weight: 2

# Распределение загрязнения при генерации каждого нового экземпляра предмета.
# weight задаёт частоту диапазона, minimum/maximum - границы значения 0..1.
# Чистые предметы всё ещё возможны, но не являются единственным результатом.
contaminationBands:
  - minimum: 0.00
    maximum: 0.00
    weight: 35
  - minimum: 0.01
    maximum: 0.20
    weight: 40
  - minimum: 0.20
    maximum: 0.55
    weight: 20
  - minimum: 0.55
    maximum: 0.90
    weight: 5

# Какая доля загрязнения пилюли переходит персонажу при употреблении.
# 1.0 переносит значение пилюли полностью; итог у персонажа всегда ограничен 0..100%.
contaminationAbsorptionPerPill: 1.0

# Уровень определяется по minimumContamination. Эффекты уровня заменяют эффекты
# предыдущего, а не суммируются с ними. Используйте только поддерживаемые type:
# TickEfficiency, SpiritualPowerGain, HealthRegeneration, MissionProgress,
# BreakthroughChance, Attack, AttackSpeed, MaximumHealth, LongevityYears и AgingSpeed.
contaminationLevels:
  - minimumContamination: 0.01
    name: Легкое загрязнение
    effects:
      - { type: TickEfficiency, operation: AdditivePercent, value: -5 }
      - { type: HealthRegeneration, operation: AdditivePercent, value: -10 }
      # Стартовый штраф к пределу жизни. Старение и долголетие - разные параметры.
      - { type: LongevityYears, operation: Flat, value: -0.5 }
  - minimumContamination: 0.25
    name: Умеренное загрязнение
    effects:
      - { type: TickEfficiency, operation: AdditivePercent, value: -12 }
      - { type: HealthRegeneration, operation: AdditivePercent, value: -25 }
      - { type: MissionProgress, operation: AdditivePercent, value: -10 }
      - { type: LongevityYears, operation: Flat, value: -0.5 }
  - minimumContamination: 0.50
    name: Тяжелое загрязнение
    effects:
      - { type: TickEfficiency, operation: AdditivePercent, value: -25 }
      - { type: SpiritualPowerGain, operation: AdditivePercent, value: -20 }
      - { type: HealthRegeneration, operation: AdditivePercent, value: -45 }
      - { type: BreakthroughChance, operation: Flat, value: -5 }
      - { type: Attack, operation: AdditivePercent, value: -10 }
      - { type: LongevityYears, operation: Flat, value: -0.5 }
  - minimumContamination: 0.75
    name: Критическое загрязнение
    effects:
      - { type: TickEfficiency, operation: AdditivePercent, value: -40 }
      - { type: SpiritualPowerGain, operation: AdditivePercent, value: -35 }
      - { type: HealthRegeneration, operation: AdditivePercent, value: -70 }
      - { type: MissionProgress, operation: AdditivePercent, value: -30 }
      - { type: BreakthroughChance, operation: Flat, value: -12 }
      - { type: Attack, operation: AdditivePercent, value: -25 }
      - { type: AttackSpeed, operation: AdditivePercent, value: -20 }
      - { type: LongevityYears, operation: Flat, value: -0.5 }

# Кривая стоимости предмета от его качества.
# quality = входное качество предмета.
# multiplier = множитель к базовой цене предмета.
#
# Обычная кривая цены для качества 1..5. Между точками используется линейная интерполяция.
qualityPriceCurve:
  - quality: 1.0
    multiplier: 1.0
  - quality: 2.0
    multiplier: 1.25
  - quality: 3.0
    multiplier: 1.75
  - quality: 4.0
    multiplier: 2.50
  - quality: 5.0
    multiplier: 3.50

# Особая цена качества 0.1 по категориям. Для значений 0.1..1.0 код интерполирует
# к первой точке qualityPriceCurve. Core намеренно не указан: его обычное качество 1..5.
lowQualityPriceMultipliers:
  Ingredient: { quality: 0.1, multiplier: 0.20 }
  Pill: { quality: 0.1, multiplier: 0.50 }
