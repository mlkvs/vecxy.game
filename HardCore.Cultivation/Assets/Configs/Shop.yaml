# ============================================================
# ЛАВКА
# ============================================================
# Этот файл управляет тем, как генерируется ассортимент магазина.
#
# Важно:
# - Сама "стоимость" предмета складывается из:
#   basePrice предмета
#   * qualityPriceCurve
#   * rarity priceMultiplier
#   * buy markup магазина
#
# Поэтому если цена кажется слишком высокой или низкой, сначала проверьте:
# 1. Items.yaml -> basePrice
# 2. Rarities.yaml -> priceMultiplier
# 3. GameBalance.yaml -> qualityPriceCurve
# 4. И только потом Shop.yaml

# Сколько слотов одновременно показывать в каждой вкладке лавки.
ingredientSlotCount: 6
pillAndCoreSlotCount: 6

# В каждом слоте всегда ровно один предмет. После покупки карточка исчезает
# до следующего ежегодного обновления ассортимента.
minimumQuantity: 1

# Оставляйте значение равным minimumQuantity: интерфейс лавки не показывает
# остаток и всегда продаёт одну сгенерированную единицу.
maximumQuantity: 1

# Минимальная магазинная наценка в процентах.
# 25 = предмет будет продаваться минимум на 25% дороже своей "истинной" цены.
minimumBuyMarkup: 25

# Максимальная магазинная наценка в процентах.
# Магазин каждый раз роллит значение в диапазоне minimum..maximum.
maximumBuyMarkup: 100

# Модификатор продажи игроком.
# Отрицательное значение значит, что игрок продаёт дешевле реальной цены.
# -33 = примерно 67% от реальной стоимости.
sellAdjustmentPercent: -33
