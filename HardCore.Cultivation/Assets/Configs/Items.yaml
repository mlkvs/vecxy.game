# ============================================================
# ПРЕДМЕТЫ
# ============================================================
# Это главный контентный файл предметов.
# Здесь задаются:
# - список всех предметов
# - их названия и описания
# - иконки
# - категории
# - тип длительности
# - базовая цена
# - частота появления в генерации
# - игровые эффекты
#
# Важные правила:
# - id должен быть уникальным
# - icon должен указывать на существующую картинку
# - category влияет на вкладку в инвентаре и на некоторые миссии
# - durationType определяет, как работает предмет:
#   Instant                — эффект применяется сразу
#   Temporary              — эффект действует ограниченное число тиков
#   Permanent              — эффект остаётся навсегда
#   UntilBreakthroughAttempt — действует до ближайшей попытки прорыва
#
# По эффектам:
# type:
# - TickEfficiency      — множитель эффективности тика / общей продуктивности
# - AgingSpeed          — изменение скорости старения
# - TimeAcceleration    — сколько "времени" проходит за один тик: ускоряет дух,
#   миссии и старение/убывание жизненной свечи одновременно
# - BreakthroughChance  — бонус к шансу прорыва
# - SpiritualPowerGain  — бонус к духовной силе
# - MissionProgress     — ускорение миссий
# - HealthRegeneration  — восстановление здоровья в секунду;
#   база задаётся через healthRegenerationPerSecond в Combat.yaml
# - MaximumHealth       — максимум здоровья
# - Attack              — сила атаки
# - AttackSpeed         — атак в секунду
# - LongevityYears      — изменение максимального предела жизни в годах
# - HealthRestore       — мгновенно восстанавливает здоровье; используйте только с Instant
# - PurifyContamination — мгновенно снимает заданный процент загрязнения; используйте только с Instant
#
# operation:
# - Flat                  — плоское добавление
# - AdditivePercent       — прибавка в процентах
# - MultiplicativePercent — отдельный мультипликатор
#
# Формула модифицируемого параметра:
# (base + сумма Flat) * (1 + сумма AdditivePercent / 100)
#                  * произведение (1 + MultiplicativePercent / 100)
#
# Важно: базовое значение записывается в value рядом с типом эффекта.
# Оно затем умножается на качество и priceMultiplier редкости.
# У созданных алхимией пилюль итоговый CraftedEffect уже включает качество,
# количество ингредиентов и долю совпадений по формуле Alchemy.yaml,
# поэтому повторный множитель качества к нему не применяется.
# Для очистки загрязнения value задаёт точный процент экземпляра.
# Несколько активных эффектов одного типа складываются или перемножаются
# согласно operation. Постоянные эффекты также могут накапливаться.
#
# Практический совет:
# - Для "прямой силы" и разовых банок обычно удобнее Flat
# - Для долгих бафов темпа чаще подходят AdditivePercent

