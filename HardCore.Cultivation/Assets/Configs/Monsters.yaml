# ============================================================
# МОНСТРЫ ДЛЯ АВТОБОЯ
# ============================================================
# Монстры попадают в бой через possibleMonsterIds конкретной миссии.
# Если в пуле несколько монстров, выбор учитывает selectionWeight.
#
# Поля монстра:
# - id — уникальный идентификатор, который указывается в Missions.yaml;
# - name — имя врага в интерфейсе боя;
# - spriteSet — базовый путь без суффикса анимации и расширения;
# - maximumHealth — базовый максимум HP до множителя опасности;
# - attack — базовый урон до множителя опасности;
# - defense — вычитается из атаки героя, но урон не бывает ниже 1;
# - attacksPerSecond — количество атак в секунду, должно быть больше 0;
# - selectionWeight — относительная частота выбора внутри пула миссии.
#
# Итоговые HP, атака и защита умножаются на monsterPowerMultiplier
# соответствующего уровня опасности из Combat.yaml. Скорость не умножается.
# Например, веса 12 и 8 в одном пуле дают примерно 60% и 40% выбора.
#
# Для каждого spriteSet нужны горизонтальные спрайтшиты с кадрами 48x48:
# - <spriteSet>_idle.png   — 4 кадра;
# - <spriteSet>_attack.png — 4 кадра;
# - <spriteSet>_hurt.png   — 2 кадра;
# - <spriteSet>_death.png  — 4 кадра.

monsters:
  - id: mountain_bandit
    name: Горный разбойник
    spriteSet: Textures/Characters/1 Old_man/Old_man
    maximumHealth: 75
    attack: 12
    defense: 2
    attacksPerSecond: 0.85
    selectionWeight: 12

  - id: corrupted_adept
    name: Осквернённый адепт
    spriteSet: Textures/Characters/2 Old_woman/Old_woman
    maximumHealth: 95
    attack: 15
    defense: 4
    attacksPerSecond: 1.05
    selectionWeight: 9

  - id: crimson_beast
    name: Багровый зверь
    spriteSet: Textures/Characters/4 Woman/Woman
    maximumHealth: 125
    attack: 19
    defense: 6
    attacksPerSecond: 0.75
    selectionWeight: 7

  - id: thunder_bird
    name: Громовая птица
    spriteSet: Textures/Characters/5 Boy/Boy
    maximumHealth: 90
    attack: 17
    defense: 3
    attacksPerSecond: 1.35
    selectionWeight: 8

  - id: ancient_guardian
    name: Древний страж
    spriteSet: Textures/Characters/6 Girl/Girl
    maximumHealth: 160
    attack: 22
    defense: 9
    attacksPerSecond: 0.7
    selectionWeight: 5
