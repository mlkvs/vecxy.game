# ============================================================
# МИССИИ
# ============================================================
# Этот файл описывает:
# - сколько миссий одновременно показывать на доске
# - список всех возможных миссий
# - диапазон длительности миссий
# - частоту появления
# - тип и объём награды
# - наличие боя, пул врагов и пул боевых фонов
#
# Как это работает:
# - boardSlotCount определяет размер доски доступных миссий.
# - Каждый новый "год" миссии обновляются.
# - Для каждой миссии случайно выбирается длительность в диапазоне
#   minimumDurationTicks..maximumDurationTicks.
# - Награда состоит из рублей и/или предметов указанной категории.
# - Если предметов несколько, редкость и качество КАЖДОЙ единицы бросаются
#   отдельно. Они не наследуют один общий результат генерации на весь стак.
# - Для каждого предложения случайно выбирается одно значение из possibleDangerLevels.
# - При ПРИНЯТИИ миссии один раз проверяется шанс
#   encounterChancePercent соответствующего уровня из Combat.yaml.
# - При успешном броске бой начнётся между 25% и 75% прогресса миссии.
# - После победы выполнение продолжится. После поражения миссия удаляется
#   без награды, HP остаётся на минимальном значении, но новые миссии не
#   блокируются — можно рискнуть сразу или сначала восстановиться.

# Сколько миссий одновременно видно на доске.
# Не должно быть больше общего числа mission entries.
boardSlotCount: 8

missions:
  # id — уникальный технический идентификатор
  # name — название в UI
  # description — описание в карточке миссии
  # minimumDurationTicks / maximumDurationTicks — диапазон длительности
  # boardWeight — шанс появления на доске
  # stageId — стадия пула: на доске видны текущая стадия игрока и соседние.
  #   Стадия также задаёт базовую силу врага в боевой миссии.
  # possibleDangerLevels — список level из Combat.yaml для случайного выбора на доске
  # possibleMonsterIds — id из Monsters.yaml; выбор учитывает selectionWeight
  # possibleBackgroundIds — id фонов из Combat.yaml; все имеют равный шанс
  # reward.requiredItemCategory — какая категория предметов может выпасть
  # reward.minimumQuantity / maximumQuantity — диапазон количества; каждая
  #   единица внутри выбранного количества получает отдельные качество и редкость
  # reward.money — денежная награда
  #
  # В опасной миссии оба списка possible* обязательны и не могут быть пустыми.
  # В безопасной миссии possibleDangerLevels и possible* лучше вообще не указывать.

  - id: gather_mist_herbs
    stageId: body_tempering
    name: Сад туманной долины
    description: Соберите ингредиенты до рассеивания утреннего тумана.
    minimumDurationTicks: 8
    maximumDurationTicks: 18
    boardWeight: 18
    possibleDangerLevels: [1, 2, 3]
    possibleMonsterIds: [corrupted_adept]
    possibleBackgroundIds: [mist_forest]
    reward:
      requiredItemCategory: Ingredient
      minimumQuantity: 1
      maximumQuantity: 3
      money: 35

  - id: hunt_crimson_beast
    stageId: golden_core
    name: След багрового зверя
    description: Выследите духовного зверя и извлеките его ядро.
    minimumDurationTicks: 24
    maximumDurationTicks: 48
    boardWeight: 11
    possibleDangerLevels: [1, 2, 3]
    possibleMonsterIds: [crimson_beast, corrupted_adept]
    possibleBackgroundIds: [mist_forest, mountain_pass]
    reward:
      requiredItemCategory: Core
      minimumQuantity: 1
      maximumQuantity: 2
      money: 120

  - id: guard_mountain_pass
