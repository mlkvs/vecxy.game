    description: Защитите караван секты на опасном перевале.
    minimumDurationTicks: 40
    maximumDurationTicks: 72
    boardWeight: 8
    possibleDangerLevels: [1, 2, 3]
    possibleMonsterIds: [mountain_bandit, corrupted_adept]
    possibleBackgroundIds: [mountain_pass]
    reward:
      requiredItemCategory: Pill
      minimumQuantity: 1
      maximumQuantity: 2
      money: 260

  - id: collect_jade_lotus
    stageId: qi_gathering
    name: Цветение нефритового лотоса
    description: Доберитесь до горного источника и соберите лотосы до закрытия бутонов.
    minimumDurationTicks: 10
    maximumDurationTicks: 22
    boardWeight: 16
    possibleDangerLevels: [1, 2, 3]
    possibleMonsterIds: [corrupted_adept]
    possibleBackgroundIds: [mist_forest]
    reward:
      requiredItemCategory: Ingredient
      minimumQuantity: 2
      maximumQuantity: 4
      money: 55

  - id: cleanse_spirit_cave
    stageId: qi_gathering
    name: Очищение пещеры духов
    description: Развейте скверну в заброшенной пещере и восстановите защитные печати.
    minimumDurationTicks: 18
