  - id: meditate_waterfall
    stageId: body_tempering
    name: Медитация у водопада
    description: Сохраните концентрацию под ледяным потоком и принесите записи наставнику.
    minimumDurationTicks: 6
    maximumDurationTicks: 14
    boardWeight: 20
    possibleDangerLevels: [1, 2, 3]
    possibleMonsterIds: [corrupted_adept]
    possibleBackgroundIds: [mist_forest]
    reward:
