    possibleMonsterIds: [ancient_guardian, crimson_beast, thunder_bird]
    possibleBackgroundIds: [storm_valley, ancient_ruins]
    reward:
      requiredItemCategory: Core
      minimumQuantity: 2
      maximumQuantity: 3
      money: 480
