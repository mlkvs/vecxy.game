missions:
  # id — уникальный технический идентификатор
  # name — название в UI
  # description — описание в карточке миссии
  # minimumDurationTicks / maximumDurationTicks — диапазон длительности
  # boardWeight — шанс появления на доске
  # stageId — legacy-связь с культивацией; больше не определяет выбор или силу миссии.
  # possibleDangerLevels — список level из Combat.yaml для случайного выбора на доске
  # possibleMonsterIds — id из Monsters.yaml; выбор учитывает selectionWeight
  # possibleBackgroundIds — id фонов из Combat.yaml; все имеют равный шанс
  # reward.requiredItemCategory — устаревшее поле, оставлено для совместимости;
  #   текущая доска выбирает предметы из полного пула
  # reward.minimumQuantity / maximumQuantity — диапазон количества; каждая
  #   единица внутри выбранного количества получает отдельные качество и редкость
  # reward.money — денежная награда
  #
  # В опасной миссии оба списка possible* обязательны и не могут быть пустыми.
  # В безопасной миссии possibleDangerLevels и possible* лучше вообще не указывать.

  - id: gather_mist_herbs
    stageId: body_tempering
    name: Сад туманной долины
    description: Соберите ингредиенты до рассеивания утреннего тумана.
    minimumDurationTicks: 8
    maximumDurationTicks: 18
    boardWeight: 18
    possibleDangerLevels: [1, 2, 3]
    possibleMonsterIds: [corrupted_adept]
    possibleBackgroundIds: [mist_forest]
    reward:
      requiredItemCategory: Ingredient
      minimumQuantity: 1
      maximumQuantity: 3
      money: 35

  - id: hunt_crimson_beast
