# ============================================================
# СОБАКА-МЕДИТАТОР
# ============================================================
# Собака постепенно накапливает заряд в реальном времени, пока игра запущена.
# chargedTexture проявляется поверх meditatingTexture снизу вверх. Когда заряд
# достигает 100%, вокруг собаки включается свечение. Нажатие выдаёт случайную
# денежную награду, сбрасывает заряд до 0 и запускает новый цикл ожидания.
# Прогресс сохраняется вместе с игрой, но закрытая игра не начисляет офлайн-время.

# Для каждого режима используется пара текстур: спокойная снизу и заряженная
# поверх неё. chargedTexture и missionChargedTexture проявляются снизу вверх
# по мере заполнения. Обе текстуры внутри каждой пары должны иметь одинаковые
# размеры и одинаковое расположение силуэта, иначе граница будет сдвигаться.
meditatingTexture: Textures/Dog.png
chargedTexture: Textures/Dog2.png
missionMeditatingTexture: Textures/Dog_Missions.png
missionChargedTexture: Textures/Dog_Missions2.png

# Локальная позиция относительно персонажа в единицах сцены.
# Чем больше localPositionX, тем правее и ближе к персонажу находится собака.
localPositionX: -320
localPositionY: 280

# Основной масштаб спрайта собаки.
baseScale: 0.28

# Полный цикл накопления в секундах реального времени.
chargeDurationSeconds: 60

# Награда = случайное целое число minimumRewardUnits..maximumRewardUnits,
# умноженное на rewardUnitRubles. Текущая настройка даёт 1 000–5 000 рублей.
rewardUnitRubles: 200
minimumRewardUnits: 1
maximumRewardUnits: 5

# Собака плавно растёт от minimumChargeScale до maximumChargeScale по мере
# накопления. После получения награды масштаб возвращается к минимуму.
minimumChargeScale: 0.96
maximumChargeScale: 1.02

# Постоянные живые движения. Амплитуды можно поставить в 0, чтобы отключить.
# swayAmplitudeRadians задаётся в радианах.
bobAmplitude: 5
bobSpeed: 3.1
swayAmplitudeRadians: 0.022
swaySpeed: 1.8
breathingAmplitude: 0.008
breathingSpeed: 2.2

# Свечение готовой собаки: размер, пульсация и RGBA-цвет.
# Компоненты цвета и alpha задаются в диапазоне 0..1.
glowScale: 1.12
glowPulseAmplitude: 0.06
glowPulseSpeed: 2.8
glowRed: 1.0
glowGreen: 0.72
glowBlue: 0.22
glowAlpha: 0.28

# Область нажатия вычисляется автоматически по экранным границам meditatingTexture.
# Она учитывает позицию, масштаб, покачивание и поворот собаки; отдельно настраивать
# прямоугольник клика не требуется.
