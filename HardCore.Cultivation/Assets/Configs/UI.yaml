# ============================================================
# СИСТЕМНЫЕ НАСТРОЙКИ UI
# ============================================================
# Это технический конфиг интерфейса.
# Геймдизайнеру обычно нужен реже, чем остальные,
# но он влияет на ощущение плавности и масштаба UI.

# Эталонное разрешение интерфейса.
# От него считаются масштаб и layout.
# Если уменьшить значения, интерфейс визуально станет крупнее.
referenceResolution:
  - 720
  - 1280

# Режим масштабирования UI.
# fit = интерфейс подгоняется под окно целиком.
scaleMode: fit

# Скорость прокрутки UI-списков колесом/жестом.
scrollSpeed: 110

# Порог начала drag-scroll.
# Чем выше число, тем сложнее случайно начать прокрутку.
dragScrollThreshold: 8

# Насколько быстро затухает инерция прокрутки.
# Большее значение = прокрутка быстрее останавливается.
scrollDeceleration: 2800

# Включать ли тени в UI.
# true = красивее, но может быть тяжелее на слабом железе.
enableShadows: false

# Подключённые атласы спрайтов.
# Обычно геймдизайнер меняет эти значения только если меняется пайплайн арта.
spriteAtlases:
  items: Assets/Textures/ItemsIconsAtlas.atlas
  ui: Assets/Textures/UIIconsAtlas.atlas
