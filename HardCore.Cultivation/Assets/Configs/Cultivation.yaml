# ============================================================
# ПРОГРЕССИЯ КУЛЬТИВАЦИИ
# Все стоимости уровней вычисляются в C# из этих исходных параметров.
# Не добавляйте сюда рассчитанные стоимости уровней.
# ============================================================

# Первые две стоимости первой стадии. Меняйте их, чтобы сдвинуть темп ранней игры.
initialRequiredPower: [100, 200]

# Коэффициент входа в каждую следующую стадию. Он применяется только к L1 и L2
# новой стадии, а не к recursiveCoefficient этой стадии.
stageEntryCoefficient: 0.70

# Бонус шанса прорыва за каждую полную дополнительную шкалу духовной силы.
breakthroughChancePerExtraPowerBar: 10

# Порядок записей - порядок прохождения стадий. id является стабильным ключом
# для сохранений; не используйте позицию записи как идентификатор стадии.
stages:
  - id: body_tempering
    name: Закалка тела
    # Коэффициент рекурсии L(n) = k * (L(n-1) + L(n-2)).
    recursiveCoefficient: 0.70
    # Множитель духовной силы за тик на этой стадии.
    # Устаревшее поле, оставлено для совместимости: в расчётах не используется.
    # Сила за тик и тап меняется только пилюлями и другими эффектами.
    spiritualPowerMultiplier: 1.0
    baseBreakthroughChance: 80
    statsPerLevel: { maximumHealth: 5, healthRegeneration: 0.1, attack: 0.5, attacksPerSecond: 0.05, longevityYears: 0.5 }
    breakthroughBonus: { maximumHealth: 50, healthRegeneration: 0.5, attack: 5, attacksPerSecond: 0.5, longevityYears: 12 }
  - id: qi_gathering
    name: Собирание Ци
    recursiveCoefficient: 0.67
    spiritualPowerMultiplier: 1.0
    baseBreakthroughChance: 65
    statsPerLevel: { maximumHealth: 10, healthRegeneration: 0.25, attack: 1, attacksPerSecond: 0.1, longevityYears: 1 }
    breakthroughBonus: { maximumHealth: 200, healthRegeneration: 0.75, attack: 10, attacksPerSecond: 0.5, longevityYears: 25 }
  - id: golden_core
    name: Золотое ядро
    recursiveCoefficient: 0.64
    spiritualPowerMultiplier: 1.0
    baseBreakthroughChance: 40
    statsPerLevel: { maximumHealth: 25, healthRegeneration: 0.35, attack: 2, attacksPerSecond: 0.15, longevityYears: 1.5 }
    breakthroughBonus: { maximumHealth: 750, healthRegeneration: 2, attack: 20, attacksPerSecond: 0.75, longevityYears: 40 }
  - id: nascent_soul
    name: Зарождающаяся душа
    recursiveCoefficient: 0.61
    spiritualPowerMultiplier: 1.0
    baseBreakthroughChance: 30
    statsPerLevel: { maximumHealth: 50, healthRegeneration: 0.75, attack: 3, attacksPerSecond: 0.2, longevityYears: 2 }
    breakthroughBonus: { maximumHealth: 1500, healthRegeneration: 5, attack: 40, attacksPerSecond: 1.25, longevityYears: 80 }
  - id: soul_formation
    name: Формирование души
    recursiveCoefficient: 0.58
    spiritualPowerMultiplier: 1.0
    baseBreakthroughChance: 22
    statsPerLevel: { maximumHealth: 150, healthRegeneration: 2, attack: 4, attacksPerSecond: 0.25, longevityYears: 3 }
    breakthroughBonus: { maximumHealth: 2500, healthRegeneration: 10, attack: 80, attacksPerSecond: 2, longevityYears: 125 }
  - id: void_refinement
    name: Очищение пустоты
    recursiveCoefficient: 0.55
    spiritualPowerMultiplier: 1.0
    baseBreakthroughChance: 15
    statsPerLevel: { maximumHealth: 250, healthRegeneration: 4, attack: 5, attacksPerSecond: 0.3, longevityYears: 5 }
    breakthroughBonus: { maximumHealth: 5000, healthRegeneration: 20, attack: 150, attacksPerSecond: 3, longevityYears: 300 }
  - id: immortal_ascension
    name: Вознесение бессмертного
    recursiveCoefficient: 0.52
    spiritualPowerMultiplier: 1.0
    baseBreakthroughChance: 100
    statsPerLevel: { maximumHealth: 500, healthRegeneration: 8, attack: 10, attacksPerSecond: 0.5, longevityYears: 7.5 }
